{% load static %}
<div class="top-bar" id="sale-top-bar">
    <span class="line-1 sale-top-bar-content">
        უფასო მიწოდება მინ. 100₾-იან შენაძენზე
    </span>
</div>

<style>
    @font-face {
        font-family: 'FiraGO Medium';
        src: url('{% static 'assets/fonts/firago/FiraGO-Medium.ttf' %}') format('truetype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'FiraGO ExtraBold';
        src: url('{% static 'assets/fonts/firago/FiraGO-ExtraBold.ttf' %}') format('truetype');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
    }

    #sale-top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10020;
        display: grid;
        place-items: center;
        min-height: 64px;
        height: auto;
        padding: 10px 18px;
        box-sizing: border-box;
        background: #f6e7e4;
        border-top: 1px solid #e6d6d2;
        border-bottom: 1px solid #e6d6d2;
        color: #ef5b3a;
        font-family: 'FiraGO Medium', Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0;
    }

    .sale-top-bar-content {
        display: grid;
        place-items: center;
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        padding: 0;
        line-height: 1.25;
        text-align: center;
        font-family: 'FiraGO ExtraBold', 'FiraGO Medium', Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 800;
    }

    body #tt-header.tt-header-fixed {
        top: 64px;
    }
    /* Keep legacy hamburger below the sale bar on pages that use both. */
    body .menu-toggle.menu-toggle-2.hamburger--emphatic {
        top: 90px;
    }

    @media (max-width: 575px) {
        body #tt-header.tt-header-fixed {
            top: 64px;
        }
        body .menu-toggle.menu-toggle-2.hamburger--emphatic {
            top: 90px;
            left: 12px;
        }

        #sale-top-bar {
            min-height: 64px;
            padding: 8px 12px;
        }

        .sale-top-bar-content {
            font-size: 14px;
        }
    }
</style>
